name: 每週掃描新店

on:
  schedule:
    - cron: "0 1 * * 1"   # 每週一台灣時間早上 9 點（UTC 時間 1 點）
  workflow_dispatch:        # 允許手動點按鈕立即執行一次

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安裝套件
        run: pip install requests

      - name: 執行掃描
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python scan.py

      - name: 產生網站資料
        run: python export_data.py

      - name: 自動提交更新
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add snapshot.json data.js
          git diff --quiet --cached || git commit -m "每週自動更新：$(date +'%Y-%m-%d')"
          git push